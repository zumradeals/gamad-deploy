# GAMAD Deploy — reverse proxy (HTTP, port 80)
# Certbot/SSL adds HTTPS when DOMAIN is set in .env and install.sh runs SSL step.

upstream control_plane {
    server control-plane:3000;
    keepalive 32;
}

upstream web_app {
    server web:80;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    client_max_body_size 50m;

    # ACME challenge — nécessaire pour certbot webroot (renouvellement)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API routes → control-plane
    location /api/ {
        proxy_pass         http://control_plane/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket realtime — transitions d'état déploiement (gateway /events)
    # Doit précéder /api/ car nginx choisit la location la plus spécifique.
    location /api/events {
        proxy_pass         http://control_plane/events;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
    }

    # WebSocket (Socket.IO) — requires connection upgrade
    location /socket.io/ {
        proxy_pass         http://control_plane/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
    }

    # Everything else → React SPA
    location / {
        proxy_pass         http://web_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
