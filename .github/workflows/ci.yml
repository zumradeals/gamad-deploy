name: CI

on:
  push:
    branches: [main, 'claude/**', 'cursor/**']
  pull_request:

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run typecheck

  lint:
    name: Lint (including architecture rule)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run lint

  unit-tests:
    name: Unit Tests (domain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run domain unit tests
        run: pnpm --filter @gamad/control-plane run test

  test:
    name: Integration Tests (schema)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gamad
          POSTGRES_PASSWORD: gamad
          POSTGRES_DB: gamad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm --filter @gamad/schema run db:migrate
        env:
          DATABASE_URL: postgresql://gamad:gamad@localhost:5432/gamad_test
      - name: Run schema tests
        run: pnpm --filter @gamad/schema run test
        env:
          DATABASE_URL: postgresql://gamad:gamad@localhost:5432/gamad_test
