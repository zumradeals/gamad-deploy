name: CI

on:
  push:
    branches: [main, 'claude/**', 'cursor/**']
  pull_request:

jobs:
  guard-inv01:
    name: Guard INV-01 — zéro nom de plateforme dans source-inferer.ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep INV-01 — aucun nom de plateforme commerciale dans l'inférenceur
        # grep retourne 0 si trouvé (CI échoue via !) ; 1 si absent (CI passe).
        # Ce gate s'exécute DEPUIS L'EXTÉRIEUR du code applicatif — non mockable,
        # non contournable par une modif du code qu'il garde (ADR-0010).
        run: |
          ! grep -iE 'lovable|bolt|replit|cursor|\bv0\b' \
            apps/control-plane/src/domain/source-resolver/source-inferer.ts

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run typecheck

  lint:
    name: Lint (including architecture rule)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run lint

  unit-tests:
    name: Unit Tests (domain + orchestration)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests (domain + orchestration, sans PostgreSQL)
        run: pnpm --filter @gamad/control-plane run test

  test:
    name: Integration Tests (schema)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gamad
          POSTGRES_PASSWORD: gamad
          POSTGRES_DB: gamad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm --filter @gamad/schema run db:migrate
        env:
          DATABASE_URL: postgresql://gamad:gamad@localhost:5432/gamad_test
      - name: Run schema tests
        run: pnpm --filter @gamad/schema run test
        env:
          DATABASE_URL: postgresql://gamad:gamad@localhost:5432/gamad_test

  integration-tests:
    name: Integration Tests (control-plane — Redis + Postgres)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gamad
          POSTGRES_PASSWORD: gamad
          POSTGRES_DB: gamad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Apply schema migrations
        run: pnpm --filter @gamad/schema run db:migrate
        env:
          DATABASE_URL: postgresql://gamad:gamad@localhost:5432/gamad_test
      - name: Run integration tests (pipeline E2E)
        run: pnpm --filter @gamad/control-plane run test:integration
        env:
          DATABASE_URL: postgresql://gamad:gamad@localhost:5432/gamad_test
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
